<title>QE Health Check</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sticky engagement bar, left step rail (tabs on phone), working canvas of assessment cards */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --sunk:#EAEEF3; --ink:#152033; --muted:#5A6477; --line:#D9DFE8;
  --accent:#0E7466; --accent-ink:#FFFFFF; --accent-soft:#DDF0EC; --target:#B4541A;
  --l1:#C4533E; --l2:#D58A2C; --l3:#BFA437; --l4:#5E9E63; --l5:#2A8467;
  --good:#2A8467; --warn:#B7791F; --crit:#C0392B;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#161D28; --sunk:#1D2532; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2B3443;
  --accent:#3DBDA9; --accent-ink:#06201C; --accent-soft:#163A35; --target:#F0955C;
  --l1:#D9695A; --l2:#E09B45; --l3:#CDB64E; --l4:#76B57A; --l5:#45A986;
  --good:#45A986; --warn:#E0A64A; --crit:#E2665A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#161D28; --sunk:#1D2532; --ink:#E5E9F1; --muted:#9AA4B6; --line:#2B3443;
  --accent:#3DBDA9; --accent-ink:#06201C; --accent-soft:#163A35; --target:#F0955C;
  --l1:#D9695A; --l2:#E09B45; --l3:#CDB64E; --l4:#76B57A; --l5:#45A986;
  --good:#45A986; --warn:#E0A64A; --crit:#E2665A; color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.25rem}
h2{font-size:1.45rem}
h3{font-size:1.05rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 220px}
.brand .client{font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.status{font-size:.8rem;color:var(--muted);margin-right:4px}
.status.dirty{color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:500;font-size:.88rem}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--crit)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:.8rem}

/* Shell */
.shell{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;display:flex;flex-direction:column;gap:4px}
.step{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:center;text-decoration:none;color:var(--ink);padding:9px 10px;border-radius:var(--r)}
.step:hover{background:var(--sunk)}
.step.on{background:var(--accent-soft)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 .78rem var(--f-mono);border:1.5px solid var(--line);background:var(--surface)}
.step.on .n{border-color:var(--accent);color:var(--accent)}
.step.done .n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.step .lbl{font-weight:500;font-size:.9rem;line-height:1.2}
.step .sub{font-size:.75rem;color:var(--muted);display:block}
.rail-note{margin-top:14px;padding:12px;border-radius:var(--r);background:var(--sunk);font-size:.8rem;color:var(--muted)}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
.view-head{display:flex;flex-direction:column;gap:6px;max-width:72ch}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);border:1px dashed var(--target);color:var(--ink);background:var(--surface);font-size:.88rem}
.banner b{color:var(--target)}

/* Cards & forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.82rem;font-weight:500;color:var(--muted)}
input[type=text],input[type=date],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);width:100%}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 11px;font-size:.82rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* Segmented scales */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--bg);flex-wrap:nowrap}
.seg button{border:0;border-right:1px solid var(--line);background:transparent;padding:6px 0;min-width:38px;font:500 .82rem var(--f-mono)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sunk)}
.seg button.on{color:#fff}
.seg button.on.v1{background:var(--l1)} .seg button.on.v2{background:var(--l2)} .seg button.on.v3{background:var(--l3)}
.seg button.on.v4{background:var(--l4)} .seg button.on.v5{background:var(--l5)}
.seg button.on.v0{background:var(--muted)}
.seg.txt{flex-wrap:wrap}
.seg.txt button{padding:6px 10px;font-family:var(--f-body)}
.seg.txt button.on{background:var(--accent);color:var(--accent-ink)}
.seg.pri button.on.p1{background:var(--l3)} .seg.pri button.on.p2{background:var(--l2)} .seg.pri button.on.p3{background:var(--l1)}

/* Dimension blocks */
.dim{padding:0;gap:0}
.dim-h{display:flex;gap:14px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;padding:16px 18px;border-bottom:1px solid var(--line)}
.dim-h .ttl{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1 1 260px}
.tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:4px;background:var(--sunk);color:var(--muted);width:max-content}
.dim-score{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.score-pill{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.score-pill .v{font:600 1.15rem var(--f-mono)}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;padding:14px 18px;border-bottom:1px solid var(--line)}
.q:last-of-type{border-bottom:0}
.q .qt{font-weight:600}
.anch{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.8rem;color:var(--muted)}
.anch div{padding:6px 8px;border-radius:6px;border:1px solid transparent}
.anch div.hit{border-color:var(--line);background:var(--bg);color:var(--ink)}
.anch b{font-family:var(--f-mono);font-weight:500;margin-right:4px}
.dim-f{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:14px 18px;background:var(--sunk);border-radius:0 0 10px 10px;align-items:start}
.lv-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.lvbg1{background:var(--l1)}.lvbg2{background:var(--l2)}.lvbg3{background:var(--l3)}.lvbg4{background:var(--l4)}.lvbg5{background:var(--l5)}

/* AI lifecycle */
.act{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.act .side{display:flex;flex-direction:column;gap:10px}
.offer{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:.85rem;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.offer.pick{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.offer .k{font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rec{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;padding:3px 9px;border-radius:999px}
.rec.acc{background:color-mix(in srgb,var(--target) 16%,transparent);color:var(--target)}
.rec.enb{background:var(--accent-soft);color:var(--accent)}
.rec.hyb{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.why{font-size:.78rem;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolhit{font-size:.78rem;color:var(--muted)}

/* Results */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.tile .big{font:600 1.7rem var(--f-mono);line-height:1.1}
.tile .big small{font-size:.9rem;color:var(--muted);font-weight:500}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:20px}
.chart-wrap{overflow-x:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:middle;border-radius:2px}
.bars{display:flex;flex-direction:column;gap:12px}
.bar{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}
.bar .bl{display:flex;justify-content:space-between;font-size:.85rem;gap:8px}
.track{position:relative;height:10px;border-radius:5px;background:var(--sunk)}
.track .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.track .tg{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--target)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.85rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--sunk)}
tr:last-child td{border-bottom:0}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell{display:inline-block;min-width:30px;text-align:center;border-radius:4px;padding:1px 6px;color:#fff;font:500 .8rem var(--f-mono)}
.c0{background:var(--line);color:var(--muted)}.c1{background:var(--l1)}.c2{background:var(--l2)}.c3{background:var(--l3)}.c4{background:var(--l4)}.c5{background:var(--l5)}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lane{background:var(--sunk);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lane-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:5px;font-size:.84rem}
.item .it{font-weight:600;line-height:1.3}
.item .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.imp{font-size:.7rem;font-weight:600;padding:1px 7px;border-radius:999px;letter-spacing:.03em}
.imp.H{background:color-mix(in srgb,var(--crit) 15%,transparent);color:var(--crit)}
.imp.M{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.imp.L{background:var(--sunk);color:var(--muted)}
.src{font-size:.72rem;color:var(--muted)}
details.low summary{cursor:pointer;font-size:.82rem;color:var(--muted);padding:4px 0}
details.low .item{opacity:.8;margin-top:6px}
.empty{padding:14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted);font-size:.85rem;text-align:center}
.phases{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.phase{border-top:3px solid var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px;font-size:.84rem}
.phase.now{border-color:var(--accent)}
.phase b{font-family:var(--f-display);font-size:.95rem}
.mix{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.mix span{display:block;height:100%}
.ex-list{display:flex;flex-direction:column;gap:8px}

.dim.off{opacity:.75;border-style:dashed}
.dim.off .dim-h{border-bottom:0}
.qedit{border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.modal.wide{width:min(920px,100%)}
/* Overlay */
.ov{position:fixed;inset:0;background:color-mix(in srgb,#000 45%,transparent);z-index:20;display:flex;justify-content:center;align-items:flex-start;
  padding:calc(env(safe-area-inset-top,0px) + 40px) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(760px,100%);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lib-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lib-row:last-child{border-bottom:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 20px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.88rem;z-index:30}

@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .step{grid-template-columns:22px auto;flex:0 0 auto;padding:7px 10px}
  .step .n{width:22px;height:22px}
  .step .sub,.rail-note{display:none}
  .split,.act{grid-template-columns:minmax(0,1fr)}
  .lanes{grid-template-columns:minmax(0,1fr)}
  .phases{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .q{grid-template-columns:minmax(0,1fr)}
  .anch{grid-template-columns:minmax(0,1fr)}
  .anch div:not(.hit){display:none}
  .dim-f{grid-template-columns:minmax(0,1fr)}
  .seg button{min-width:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1>QE Health Check</h1>
      <span class="client" id="topClient">BrainRidge QA &amp; AI enablement assessment</span>
    </div>
    <div class="actions">
      <span class="status" id="saveStatus"></span>
      <button class="btn" type="button" id="btnLib">Saved assessments</button>
      <button class="btn" type="button" id="btnNew">New assessment</button>
      <button class="btn primary" type="button" id="btnSave">Save</button>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="Assessment steps"></nav>
  <main id="main"></main>
</div>

<div class="ov" id="ov" hidden></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
/* ============ FRAMEWORK CONTENT ============ */
const PORDER=["tm","tdm","tem","fnd","add"];
const PILLARS={tm:"Test management",tdm:"Test data management",tem:"Test environment management",fnd:"Foundations",add:"Additional categories"};
const LEVELS=["Not assessed","Initial","Managed","Defined","Measured","Optimized"];
const AILEVELS=["Not assessed","None","Ad hoc (individuals)","Team pilot","Standardized with guardrails","Scaled and measured"];
const EFFORT={L:"Low",M:"Medium",H:"High"};

const OUTCOMES=[
 {k:"leakage",t:"Reduce defect leakage into UAT and production"},
 {k:"speed",t:"Faster, more predictable releases"},
 {k:"cost",t:"Lower cost of quality"},
 {k:"automation",t:"Increase test automation coverage"},
 {k:"uat",t:"Reduce business effort in UAT"},
 {k:"compliance",t:"Regulatory and data privacy compliance"},
 {k:"visibility",t:"Better quality visibility and reporting"},
 {k:"aicap",t:"Build the client's own AI capability in QA"},
 {k:"aidlc",t:"Adopt AI-DLC / AI-augmented delivery"}
];

const DIMS=[
 {id:"gov",name:"Strategy, governance and operating model",short:"Governance",pillar:"tm",out:["leakage","uat","visibility"],qs:[
  {id:"gov1",t:"QA strategy and test policy",a:["No documented strategy; testing is ad hoc per project","Strategy documented per program but applied inconsistently","Enterprise QE strategy, risk-based, reviewed every quarter or PI"],rec:"Publish a risk-based QE strategy and test policy aligned to the release cadence",e:"L"},
  {id:"gov2",t:"Independent QA and clear roles",a:["Developers test their own code; business UAT is the only gate","Dedicated QA in some teams; roles and accountability unclear","QE embedded in every squad with defined roles (QE lead, SDET, AI-QE champion) and a RACI"],rec:"Define QE roles and RACI; embed QA in the highest-risk squads first",e:"M"},
  {id:"gov3",t:"Quality gates and Definition of Done",a:["No entry or exit criteria; go-live decided on judgement","Gates exist at UAT or release, partly enforced","Story, sprint and release gates with QA criteria in DoR/DoD, enforced and partly automated"],rec:"Add QA criteria to DoR/DoD and introduce a release go/no-go checklist",e:"L"},
  {id:"gov4",t:"Quality governance cadence",a:["No regular quality reviews","Periodic status reporting without decisions","Regular quality council with leadership; decisions driven by metrics"],rec:"Set up a monthly quality council and a sprint-level quality review",e:"L"}]},
 {id:"des",name:"Requirements and test design",short:"Test design",pillar:"tm",out:["leakage","uat","speed"],qs:[
  {id:"des1",t:"Requirement testability",a:["Stories often lack acceptance criteria","Acceptance criteria exist but vary in quality; QA joins late","Three-amigos refinement; testable Given/When/Then criteria before sprint start"],rec:"Run three-amigos refinement and an acceptance-criteria quality checklist",e:"L"},
  {id:"des2",t:"Test design and traceability",a:["Tests written from memory; no traceability","Tests linked to stories; some design techniques used","Risk-based design with full requirement → test → defect traceability and measured coverage"],rec:"Adopt risk-based test design with requirement-to-test traceability in Jira",e:"M"},
  {id:"des3",t:"Regression suite",a:["No maintained regression suite","Regression suite exists but is outdated or bloated","Prioritized, risk-based regression pack maintained every sprint"],rec:"Baseline and prioritize the regression pack, critical customer journeys first",e:"M"},
  {id:"des4",t:"Non-functional testing",a:["Performance, security and accessibility not tested","Tested ad hoc before major releases","NFRs defined per story and tested continuously"],rec:"Define NFR acceptance criteria and add baseline performance, security and accessibility checks",e:"H"}]},
 {id:"exe",name:"Test execution and defect management",short:"Execution & defects",pillar:"tm",out:["leakage","uat","speed"],qs:[
  {id:"exe1",t:"In-sprint testing",a:["Testing happens after development, often in UAT","Most stories tested in sprint; spillover is common","Stories tested and closed within the sprint; test-first where possible"],rec:"Shift testing into the sprint and track QA-ready vs QA-complete per story",e:"M"},
  {id:"exe2",t:"Test management tool usage",a:["Spreadsheets or no tool","Tool in place (Zephyr, Xray, ADO) but data is inconsistent","Tool is the single source of truth with execution history and traceability"],rec:"Standardize test management in Jira (Zephyr or Xray) with templates and conventions",e:"L"},
  {id:"exe3",t:"Defect lifecycle and triage",a:["No defined workflow; severity means different things to different people","Workflow defined; triage irregular and defects age","Daily triage, severity SLAs, root-cause analysis feeding prevention"],rec:"Define the defect workflow, severity SLAs and a daily triage routine",e:"L"},
  {id:"exe4",t:"UAT effectiveness",a:["Business finds most defects in UAT","UAT still finds functional defects QA missed","UAT focuses on business validation; few defects found there"],rec:"Add system and end-to-end QA before UAT using business-approved scenarios",e:"M"}]},
 {id:"aut",name:"Test automation and CI/CD",short:"Automation & CI/CD",pillar:"tm",out:["automation","speed","cost"],qs:[

function cleanCat(c){
  if(!c||typeof c!=="object"||!IDRE.test(c.id||""))return null;

  const qs=(Array.isArray(c.qs)?c.qs:[]).filter(q=>q&&IDRE.test(q.id||"")).slice(0,20).map(q=>({id:q.id,t:s(q.t),a:[0,1,2].map(i=>s((q.a||[])[i])),rec:s(q.rec),e:["L","M","H"].includes(q.e)?q.e:"M"}));
  if(!qs.length||!s(c.name))return null;
  return {id:c.id,name:s(c.name),short:s(c.short).slice(0,22)||shortOf(s(c.name)),pillar:PORDER.includes(c.pillar)?c.pillar:"add",
    out:(Array.isArray(c.out)?c.out:[]).filter(k=>OUTCOMES.some(o=>o.k===k)),custom:true,qs};
}

function normalize(s){const b=blank();const o=Object.assign(b,s);

const avg=a=>{const v=a.filter(x=>x>0);return v.length?v.reduce((s,x)=>s+x,0)/v.length:null;};
const f1=x=>x==null?"–":x.toFixed(1);
function dimScore(d,st=state){return avg(d.qs.map(q=>st.practice[q.id]||0));}
function weight(outs,st=state){let m=0;outs.forEach(k=>m=Math.max(m,st.outcomes[k]||0));return 1+m;}
function hasTool(actId,st=state){return TOOLS.filter(t=>st.meta.aiTools.includes(t.id)&&t.acts.includes(actId));}
function recommend(a,st=state){
  const r=st.readiness, own=st.prefs.ownership, tools=hasTool(a.id,st);
  const skills=r.r4||0, access=r.r3||0, policy=r.r2||0;
  let E=0,A=0;const why=[];
  if(tools.length){E+=2;why.push("Client already licenses "+tools.map(t=>t.n).join(", "));}else{A+=2;why.push("No client AI tool covers this activity");}
  if(own==="build"){E+=2;why.push("Client wants to build its own capability");}else if(own==="buy"){A+=2;why.push("Client prefers ready-made solutions");}else{E+=1;A+=1;}
  if(skills>=3)E+=1;else if(skills>0){A+=1;why.push("Team AI skills are low");}
  if(access>=3)E+=1;
  if(st.prefs.urgent){A+=1;why.push("Results needed within 90 days");}
  let auto=E-A>=2?"enb":A-E>=2?"acc":"hyb";
  const path=(st.ai[a.id].path&&st.ai[a.id].path!=="auto")?st.ai[a.id].path:auto;
  return {path,auto,why,tools,govFirst:policy>0&&policy<=2};
}
const PATHN={acc:"BRC accelerator",enb:"Embedded enablement",hyb:"Hybrid: accelerator + enablement"};
function bump(e){return e==="L"?"M":"H";}
function gapItems(st=state){
  const items=[];
  dims(st).forEach(d=>{const tgt=st.targets[d.id]||4;const w=weight(d.out,st);
    d.qs.forEach(q=>{const c=st.practice[q.id]||0;if(!c||c>=tgt)return;const gap=tgt-c;
      items.push({type:"Practice",area:d.short,pillar:PILLARS[d.pillar],title:q.rec,q:q.t,cur:c,tgt,gap,impact:gap*w,effort:q.e,path:""});});});
  acts(st).forEach(a=>{const x=st.ai[a.id];if(!x.cur||x.cur>=x.tgt)return;const gap=x.tgt-x.cur;const rc=recommend(a,st);
    let e=rc.path==="acc"?"L":"M";if(rc.govFirst)e=bump(e);
    const title=rc.path==="acc"?"Deploy "+a.acc.n+" for "+a.name.toLowerCase():rc.path==="enb"?"Enable the client team to use AI for "+a.name.toLowerCase():"Deploy "+a.acc.n+" and coach the team to own it";
    items.push({type:"AI",area:a.name,pillar:"AI-augmented testing",title,q:a.name,cur:x.cur,tgt:x.tgt,gap,impact:gap*weight(a.out,st),effort:e,path:rc.path,gov:rc.govFirst});});
  items.forEach(i=>{i.imp=i.impact>=6?"H":i.impact>=3?"M":"L";i.phase=i.effort==="L"?"Quick win (0–90 days)":i.effort==="M"?"Medium term (3–6 months)":"Strategic (6–12 months)";});
  return items.sort((a,b)=>b.impact-a.impact);
}
function summary(st=state){
  const cur=avg(dims(st).map(d=>dimScore(d,st)||0)), tgt=avg(dims(st).map(d=>st.targets[d.id]||0));
  const aiCur=avg(acts(st).map(a=>st.ai[a.id].cur||0)), aiTgt=avg(acts(st).filter(a=>st.ai[a.id].cur).map(a=>st.ai[a.id].tgt));
  const ready=avg(READY.map(r=>st.readiness[r.id]||0));
  return {cur,tgt,aiCur,aiTgt,ready};
}

function view(){const h=(location.hash||"").slice(1);return STEPS.some(s=>s.id===h)?h:"engagement";}
function progress(id){
  if(id==="engagement")return state.meta.client&&state.meta.method?1:0;
  if(id==="outcomes")return Object.values(state.outcomes).some(v=>v>0)?1:0;
  if(id==="practice"){const all=dims().flatMap(d=>d.qs);return all.length?all.filter(q=>state.practice[q.id]>0).length/all.length:0;}
  if(id==="ai")return acts().filter(a=>state.ai[a.id].cur>0).length/Math.max(1,acts().length);
  if(id==="readiness")return READY.filter(r=>state.readiness[r.id]>0).length/READY.length;
  return 0;
}

function radar(series){
  const D=dims();const N=D.length,cx=270,cy=200,R=135;
  if(N<3)return `<div class="empty">The chart needs at least three categories in scope. See the table for scores.</div>`;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;const r=R*v/5;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let g="";
  for(let l=1;l<=5;l++){g+=`<polygon points="${D.map((_,i)=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`;}
  D.forEach((d,i)=>{const [x,y]=pt(i,5);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const a=-Math.PI/2+i*2*Math.PI/N;const lx=cx+(R+16)*Math.cos(a),ly=cy+(R+16)*Math.sin(a);const anc=Math.abs(Math.cos(a))<.2?"middle":Math.cos(a)>0?"start":"end";
    g+=`<text x="${lx}" y="${ly+4}" text-anchor="${anc}" font-size="12" fill="var(--muted)" font-family="IBM Plex Sans, sans-serif">${esc(d.short)}</text>`;});
  for(let l=1;l<=5;l++){g+=`<text x="${cx+4}" y="${cy-R*l/5+4}" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${l}</text>`;}
  series.forEach(s=>{const pts=s.vals.map((v,i)=>pt(i,v||0).join(",")).join(" ");
    g+=`<polygon points="${pts}" fill="${s.fill||"none"}" stroke="${s.stroke}" stroke-width="2" ${s.dash?`stroke-dasharray="5 4"`:""}/>`;
    if(s.dots)s.vals.forEach((v,i)=>{const [x,y]=pt(i,v||0);g+=`<circle cx="${x}" cy="${y}" r="3.2" fill="${s.stroke}"/>`;});});
  return `<svg viewBox="0 0 540 400" width="100%" style="max-width:560px;min-width:420px" role="img" aria-label="Maturity radar: current versus target by dimension">${g}</svg>`;
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;let changed=true;
  if(d.q){state.practice[d.q]=+d.v;}
  else if(d.tgt){state.targets[d.tgt]=+d.v;}
  else if(d.out){state.outcomes[d.out]=+d.v;}
  else if(d.aicur){state.ai[d.aicur].cur=+d.v;if(state.ai[d.aicur].tgt<+d.v)state.ai[d.aicur].tgt=+d.v;}
  else if(d.aitgt){state.ai[d.aitgt].tgt=+d.v;}
  else if(d.aipath){state.ai[d.aipath].path=d.v;}
  else if(d.r){state.readiness[d.r]=+d.v;}
  else if(d.own){state.prefs.ownership=d.v;}
  else if(d.urg){state.prefs.urgent=d.v==="1";}
  else if(d.tool){const a=state.meta.aiTools;const i=a.indexOf(d.tool);i>=0?a.splice(i,1):a.push(d.tool);}
  else if(d.qat){const a=state.meta.qaTools;const i=a.indexOf(d.qat);i>=0?a.splice(i,1):a.push(d.qat);}
  else if(d.export){doExport(d.export);return;}
  else if(d.excl){if(state.excluded[d.excl])delete state.excluded[d.excl];else state.excluded[d.excl]=true;}
  else if(d.aiexcl){if(state.aiExcluded[d.aiexcl])delete state.aiExcluded[d.aiexcl];else state.aiExcluded[d.aiexcl]=true;}
  else if(d.rmcat){if(rmArmed!==d.rmcat){rmArmed=d.rmcat;render(true);setTimeout(()=>{if(rmArmed===d.rmcat){rmArmed=null;if(view()==="practice")render(true);}},4000);return;}
    rmArmed=null;state.custom=state.custom.filter(c=>c.id!==d.rmcat);delete state.excluded[d.rmcat];toast("Category removed from this assessment");}
  else if(d.editcat){const c=state.custom.find(x=>x.id===d.editcat);if(c)openCatEditor(c);return;}
  else if(d.newcat){openCatEditor(blankCat());return;}
  else if(d.libopen){openLibCats();return;}
  else changed=false;
  if(changed){state.example&&(state.example=false);markDirty();render(true);}
});

/* ============ SAVE / LIBRARY ============ */
/* Storage: assess/<userId> holds that lead's summary map; assess/<userId>/items/<id> holds each full assessment.
   Rules let a lead read/write only their own subtree; Editors and the owner read and manage everyone's. */
let myId=null, userApi=null, names={}, fullCache={};
const pathOf=x=>x.legacy?"assessments/"+x.id:"assess/"+x.uid+"/items/"+x.id;
async function fetchFull(x){
  if(fullCache[x.id])return fullCache[x.id];
  const snap=await db.doc(pathOf(x)).get();if(!snap.exists)throw {code:"not_found"};
  const d=snap.data();fullCache[x.id]=d;return d;
}
async function saveAssessment(){
  if(!db||!myId)return;const s=summary();
  const owner=state.ownerUid||myId;
  const meta={client:state.meta.client||"Untitled",assessor:state.meta.assessor||"",date:state.meta.date||today(),updatedAt:Date.now(),
    summary:{practice:s.cur,target:s.tgt,ai:s.aiCur,ready:s.ready}};
  $("#btnSave").disabled=true;$("#btnSave").textContent="Saving…";
  try{
    const id=state.id||uid("a");
    const body=Object.assign({},meta,{state:JSON.parse(JSON.stringify(Object.assign({},state,{id:null,example:false,ownerUid:null})))});
    await db.doc("assess/"+owner+"/items/"+id).set(body);
    const uref=db.doc("assess/"+owner);const us=await uref.get();
    const items=Object.assign({},(us.exists&&us.data().items)||{});items[id]=meta;
    await uref.set({items,updatedAt:Date.now()});
    fullCache[id]=body;state.id=id;state.ownerUid=owner;state.example=false;dirty=false;storeDraft();
    toast(isAdmin&&owner!==myId?"Saved to the QA lead's assessments":"Saved to your assessments");
  }catch(err){if(err&&err.code==="invalid_argument")canWrite=false;
    toast(err&&(err.code==="permission_denied"||err.code==="invalid_argument")?"You don't have permission to save. Ask a QA practice lead for Contributor access.":"Couldn't save ("+(err&&err.code||"error")+"). Try again or export the file.");}
  $("#btnSave").textContent="Save";updateTop();
}
let delArmed=null;
async function resolveNames(){
  if(!userApi||!isAdmin)return;const ids=[...new Set(saved.map(x=>x.uid).filter(Boolean))];if(!ids.length)return;
  try{const ps=await userApi.profiles(ids);ids.forEach(i=>{names[i]=(ps[i]&&ps[i].name)||"";});refreshLibrary();}catch(e){}
}
function libraryHtml(){
  const intro=isAdmin?"As a practice lead you see every QA lead's assessments.":"Only you and the QA practice leads can see your saved assessments.";
  const body=!db?`<div class="empty">Saving needs you to be signed in to claude.ai with your BrainRidge account. You can still export and import assessment files from the results page.</div>`:
    !myId?`<div class="empty">Couldn't identify your account, so saving is off. Reload the page to try again.</div>`:
    dbState==="loading"?`<div class="empty">Loading saved assessments…</div>`:
    dbState==="error"?`<div class="empty">Couldn't load saved assessments. Close and reopen this panel to try again.</div>`:
    !saved.length?`<div class="empty">No saved assessments yet. Fill in a health check and press Save.</div>`:
    saved.map(x=>{const who=isAdmin?(x.legacy?"Saved before privacy change":(x.uid===myId?"You":(names[x.uid]||"QA lead"))):"";
      return `<div class="lib-row"><div style="min-width:0"><b>${esc(x.client)}</b> <span class="muted">· ${esc(x.date||"")}${x.assessor?" · "+esc(x.assessor):""}${who?" · saved by "+esc(who):""}</span><div class="src mono">Practice ${f1(x.summary&&x.summary.practice)} → ${f1(x.summary&&x.summary.target)} · AI ${f1(x.summary&&x.summary.ai)} · Readiness ${f1(x.summary&&x.summary.ready)}</div></div>
      <div class="row"><button type="button" class="btn sm" data-open="${esc(x.id)}">Open</button><button type="button" class="btn sm" data-reassess="${esc(x.id)}" title="Start a new assessment using this one as the baseline">Re-assess</button>${isAdmin?`<button type="button" class="btn sm danger" data-del="${esc(x.id)}">${delArmed===x.id?"Confirm delete":"Delete"}</button>`:""}</div></div>`;}).join("");
  return `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="libT"><div class="modal-h"><h2 id="libT">${isAdmin?"All saved assessments":"My saved assessments"}</h2><button type="button" class="btn" data-close="1">Close</button></div><p class="muted">${intro} Re-assess copies an assessment as the starting point and keeps it as the comparison baseline.</p>${db&&saved.length?`<div class="row"><span class="eyebrow">Back up ${isAdmin?"all":"my"} ${saved.length} assessment${saved.length>1?"s":""}</span><button type="button" class="btn sm" data-expall="json">Full backup (.json)</button><button type="button" class="btn sm" data-expall="csv">Summary (.csv)</button></div>`:""}<div>${body}</div></div>`;
}
function openLibrary(){const ov=$("#ov");ov.innerHTML=libraryHtml();ov.hidden=false;ov.dataset.mode="lib";}
function refreshLibrary(){const ov=$("#ov");if(ov.hidden)return;if(ov.dataset.mode==="lib")ov.innerHTML=libraryHtml();else if(ov.dataset.mode==="libcats")ov.innerHTML=libraryCatsHtml();}
$("#ov").addEventListener("click",async e=>{
  if(e.target.id==="ov"&&draftCat)return;
  if(e.target.id==="ov"||e.target.dataset.close){$("#ov").hidden=true;delArmed=null;draftCat=null;libDelArmed=null;return;}
  const b=e.target.closest("button");if(!b)return;const d=b.dataset;
  if(d.cout){const o=draftCat.out;const i=o.indexOf(d.cout);i>=0?o.splice(i,1):o.push(d.cout);renderCatEditor();return;}
  if(d.qadd){draftCat.qs.push(blankQ());renderCatEditor();return;}
  if(d.qrm){draftCat.qs.splice(+d.qrm,1);renderCatEditor();return;}
  if(d.catsave){saveCat();return;}
  if(d.libadd){const c=libCats.find(x=>x.id===d.libadd);if(c&&!state.custom.some(x=>x.id===c.id)){state.custom.push(JSON.parse(JSON.stringify(c)));state.targets[c.id]=state.targets[c.id]||4;state.example=false;markDirty();render(true);toast("Added "+c.name);}refreshLibrary();return;}
  if(d.libdel){if(libDelArmed!==d.libdel){libDelArmed=d.libdel;refreshLibrary();return;}
    try{await db.doc("categories/"+d.libdel).delete();toast("Deleted from the firm library");}catch(err){toast("Couldn't delete ("+(err&&err.code||"error")+")");}libDelArmed=null;refreshLibrary();return;}
  if(d.expall){exportAll(d.expall,b);return;}
  if(d.open||d.reassess){const x=saved.find(s=>s.id===(d.open||d.reassess));if(!x)return;
    b.disabled=true;b.textContent="Loading…";
    let full;try{full=await fetchFull(x);}catch(err){toast("Couldn't open that assessment ("+(err&&err.code||"error")+")");refreshLibrary();return;}
    state=normalize(full.state||{});
    if(d.open&&!x.legacy){state.id=x.id;state.ownerUid=x.uid;compareId=state.baselineId||"";}
    else{state.id=null;state.ownerUid=null;state.baselineId=x.id;state.meta.date=today();compareId=x.id;}
    if(d.open&&x.legacy){state.baselineId=null;compareId="";}
    dirty=!!d.reassess||!!x.legacy;storeDraft();$("#ov").hidden=true;location.hash=d.reassess?"#practice":"#results";render(false);
    toast(d.reassess?"Re-assessment started from "+x.client:x.legacy?"Opened "+x.client+". Save to move it to the new storage.":"Opened "+x.client);}
  if(d.del){const x=saved.find(s=>s.id===d.del);if(!x)return;if(delArmed!==d.del){delArmed=d.del;refreshLibrary();return;}
    try{await db.doc(pathOf(x)).delete();
      if(!x.legacy){const uref=db.doc("assess/"+x.uid);const us=await uref.get();if(us.exists){const items=Object.assign({},us.data().items||{});delete items[x.id];await uref.set({items,updatedAt:Date.now()});}}
      if(state.id===d.del){state.id=null;state.ownerUid=null;dirty=true;}delete fullCache[d.del];toast("Deleted");}
    catch(err){toast("Couldn't delete ("+(err&&err.code||"error")+")");}
    delArmed=null;refreshLibrary();updateTop();}
});
async function exportAll(kind,btn){
  const stamp=today();const who=x=>x.legacy?"Saved before privacy change":x.uid===myId?"Me":(names[x.uid]||x.uid||"");
  if(kind==="csv"){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const rows=[["Client","Assessment date","Assessor","Saved by","Practice maturity","Target","AI adoption","AI readiness","Last updated"]];
    saved.forEach(x=>{const s=x.summary||{};rows.push([x.client,x.date,x.assessor,who(x),s.practice!=null?s.practice.toFixed(2):"",s.target!=null?s.target.toFixed(2):"",s.ai!=null?s.ai.toFixed(2):"",s.ready!=null?s.ready.toFixed(2):"",x.updatedAt?new Date(x.updatedAt).toISOString():""]);});
    await saveFile("qe-health-check-summary-"+stamp+".csv",rows.map(r=>r.map(q).join(",")).join("\n"));return;}
  const label=btn.textContent;btn.disabled=true;
  const out=[];let failed=0;
  for(let i=0;i<saved.length;i+=6){btn.textContent="Collecting "+Math.min(i+6,saved.length)+" of "+saved.length+"…";
    const part=await Promise.all(saved.slice(i,i+6).map(x=>fetchFull(x).then(f=>({id:x.id,savedBy:who(x),ownerId:x.uid||null,legacy:!!x.legacy,client:x.client,date:x.date,updatedAt:x.updatedAt,summary:x.summary,state:f.state})).catch(()=>{failed++;return null;})));
    part.forEach(p=>p&&out.push(p));}
  btn.disabled=false;btn.textContent=label;
  await saveFile("qe-health-check-backup-"+stamp+".json",JSON.stringify({tool:"QE Health Check",exportedAt:new Date().toISOString(),count:out.length,assessments:out,firmCategories:isAdmin?libCats:undefined},null,2));
  if(failed)toast(failed+" assessment"+(failed>1?"s":"")+" couldn't be read and were left out");
}
function ensureBaseline(){const x=saved.find(s=>s.id===compareId);if(!x||fullCache[x.id])return;fetchFull(x).then(()=>{if(view()==="results")render(true);}).catch(()=>{});}

function mdReport(){
  const s=summary();const items=gapItems();const m=state.meta;
  const L=[];L.push(`# QE Health Check: ${m.client||"Untitled"}`,``,`${[m.industry,m.method,"AI-DLC: "+m.aidlc,m.date,m.assessor&&"Assessor: "+m.assessor].filter(Boolean).join(" · ")}`,``);
  if(m.scope)L.push(`**Scope:** ${m.scope}`,``);
  L.push(`## Summary`,``,`| Measure | Current | Target |`,`|---|---|---|`,`| QA practice maturity | ${f1(s.cur)} (${lvlName(s.cur)}) | ${f1(s.tgt)} |`,`| AI adoption in QA | ${f1(s.aiCur)} | ${f1(s.aiTgt)} |`,`| AI readiness | ${f1(s.ready)} / 5 | |`,``);
  const outs=OUTCOMES.filter(o=>state.outcomes[o.k]>0).sort((a,b)=>state.outcomes[b.k]-state.outcomes[a.k]);
  if(outs.length){L.push(`## Client outcomes`,``);outs.forEach(o=>L.push(`- ${o.t} (${["","Low","Medium","High"][state.outcomes[o.k]]})`));L.push(``);}
  L.push(`## QA practice by dimension`,``,`| Pillar | Dimension | Current | Target | Evidence |`,`|---|---|---|---|---|`);
  dims().forEach(d=>L.push(`| ${PILLARS[d.pillar]} | ${d.name} | ${f1(dimScore(d))} | ${state.targets[d.id]} | ${(state.notes[d.id]||"").replace(/\n/g," ").replace(/\|/g,"/")} |`));
  const na=allDims().filter(d=>state.excluded[d.id]).map(d=>d.name).concat(ACTS.filter(a=>state.aiExcluded[a.id]).map(a=>"AI: "+a.name));
  if(na.length)L.push(``,`**Not assessed (N/A for this client):** ${na.join("; ")}`);
  L.push(``,`## AI across the QA lifecycle`,``,`| Activity | Current | Target | Delivery path | Offer |`,`|---|---|---|---|---|`);
  acts().forEach(a=>{const x=state.ai[a.id];const rc=recommend(a);L.push(`| ${a.name} | ${x.cur||"–"} | ${x.tgt} | ${PATHN[rc.path]} | ${rc.path==="enb"?a.enb:a.acc.n+": "+a.acc.d} |`);});
  [["L","Quick wins (0–90 days)"],["M","Medium term (3–6 months)"],["H","Strategic (6–12 months)"]].forEach(([e,n])=>{const li=items.filter(i=>i.effort===e);if(!li.length)return;
    L.push(``,`## ${n}`,``);li.forEach(i=>L.push(`- **${i.title}** (${i.imp==="H"?"High":i.imp==="M"?"Medium":"Low"} impact; ${i.type==="AI"?"AI · "+i.area:i.area}; ${i.cur}→${i.tgt})`));});
  return L.join("\n");
}
function csv(){const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
  const rows=[["Type","Pillar","Area","Practice","Recommendation","Current","Target","Gap","Impact score","Impact","Effort","Horizon","Delivery path"]];
  gapItems().forEach(i=>rows.push([i.type,i.pillar,i.area,i.q,i.title,i.cur,i.tgt,i.gap,i.impact,{H:"High",M:"Medium",L:"Low"}[i.imp],EFFORT[i.effort],i.phase,i.path?PATHN[i.path]:""]));
  return rows.map(r=>r.map(q).join(",")).join("\n");}
async function doExport(kind){
  const slug=(state.meta.client||"assessment").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"assessment";
  const files={md:[slug+"-qe-health-check.md",mdReport()],csv:[slug+"-gap-register.csv",csv()],json:[slug+"-qe-health-check.json",JSON.stringify(state,null,2)]};
  const [name,data]=files[kind];
  await saveFile(name,data);
}
async function saveFile(name,data){
  if(dl){try{await dl.save({filename:name,data});toast("Downloaded "+name);}catch(err){if(err&&err.code!=="declined")showText(name,data);}}
  else if(!window.claude){try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/plain"}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast("Downloaded "+name);}catch(e){showText(name,data);}}
  else showText(name,data);
}
function showText(name,data){const ov=$("#ov");
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="modal-h"><h2>${esc(name)}</h2><button type="button" class="btn" data-close="1">Close</button></div><p class="muted">Downloads aren't available here. Copy the content instead.</p><textarea id="exportText" style="min-height:300px;font-family:var(--f-mono);font-size:.8rem" readonly>${esc(data)}</textarea><div class="row"><button type="button" class="btn primary" id="btnCopy">Copy</button></div></div>`;
  ov.hidden=false;ov.dataset.mode="text";
  $("#btnCopy").addEventListener("click",()=>{const t=$("#exportText");navigator.clipboard.writeText(t.value).then(()=>toast("Copied"),()=>{t.select();toast("Press Ctrl/Cmd+C to copy");});});
}

/* ============ BOOT ============ */
render(false);
(async()=>{
  const c=window.claude;
  if(!c||!c.use){dbState="none";updateTop();return;}
  try{dl=await c.use("downloads");}catch(e){dl=null;}
  try{db=await c.use("db");}catch(e){db=null;}
  try{userApi=await c.use("user");if(userApi){isAdmin=await userApi.canEdit();canWrite=await userApi.can("data.write");myId=await userApi.id();}}catch(e){}
  if(!db){dbState="none";updateTop();refreshLibrary();return;}
  const timer=setTimeout(()=>{if(dbState==="loading"){dbState="error";refreshLibrary();}},10000);
  db.collection("categories").onSnapshot(snap=>{libCats=snap.docs.map(d=>{const x=d.data();return cleanCat(x&&x.def);}).filter(Boolean);refreshLibrary();if(view()==="practice"&&$("#ov").hidden)render(true);},()=>{});
  let mine=[],legacy=[];
  const publish=()=>{saved=mine.concat(legacy).sort((p,q)=>(q.updatedAt||0)-(p.updatedAt||0));refreshLibrary();resolveNames();if(view()==="results"&&$("#ov").hidden)render(true);};
  const fromUserDoc=(uidv,data)=>Object.entries((data&&data.items)||{}).filter(([k])=>IDRE.test(k)).map(([k,v])=>Object.assign({},v,{id:k,uid:uidv}));
  const fail=()=>{clearTimeout(timer);dbState="error";refreshLibrary();};
  if(isAdmin){
    db.collection("assess").onSnapshot(snap=>{clearTimeout(timer);dbState="ready";mine=snap.docs.flatMap(d=>fromUserDoc(d.id,d.data()));publish();},fail);
    db.collection("assessments").onSnapshot(snap=>{legacy=snap.docs.map(d=>{const x=d.data();return {id:d.id,legacy:true,client:x.client,assessor:x.assessor,date:x.date,updatedAt:x.updatedAt,summary:x.summary};});publish();},()=>{});
  }else if(myId){
    db.doc("assess/"+myId).onSnapshot(snap=>{clearTimeout(timer);dbState="ready";mine=snap.exists?fromUserDoc(myId,snap.data()):[];publish();},fail);
  }else{clearTimeout(timer);dbState="ready";}
  updateTop();
})();
</script>
